# Docker Compose for sqld + sqld-admin
#
# NOTE: The libsql/sqld repository is archived. sqld is now maintained in the
# tursodatabase/libsql repo under the libsql-server folder, and the official
# Docker image is ghcr.io/tursodatabase/libsql-server.
#
# Quick start:
#   cp .env.example .env   # set ADMIN_USER / ADMIN_PASSWORD
#   npm run auth:generate  # creates secrets/ and fills the sqld tokens
#   docker compose up -d --build
#
# Then open:
#   Admin UI:      http://localhost:3000
#   HTTP user API: http://localhost:18080
#   Admin API:     http://localhost:18081
#
# The app service builds the same image as `docker build .` (Node server plus
# the static frontend in public/) and reaches sqld over the compose network.
# The sqld ports are published for debugging and for running the app on the
# host against the Dockerized sqld.
#
# Namespace mode is enabled. Manage namespaces via the Admin API on port 18081:
#   curl -X POST http://localhost:18081/v1/namespaces/mydb/create
#
# server.js defaults to SQLD_URL=http://sqld:8080 and
# SQLD_ADMIN_URL=http://sqld:8081 (container networking). The app service below
# overrides the admin URL to 8082 because this compose file runs sqld's admin
# listener there. When running server.js on the host against this compose file,
# set SQLD_URL=http://127.0.0.1:18080 and
# SQLD_ADMIN_URL=http://127.0.0.1:18081.

services:
  app:
    build: .
    image: sqld-admin:latest
    container_name: sqld-admin
    restart: unless-stopped
    # Run as the host owner of the 0600 private key so the token UI can sign.
    # `npm run auth:generate` writes APP_UID/APP_GID into .env.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    depends_on:
      - sqld
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      HOST: 0.0.0.0
      # Container-network endpoints for the sqld service below.
      SQLD_URL: http://sqld:8080
      SQLD_ADMIN_URL: http://sqld:8082
      SQLD_HOST_SUFFIX: ${SQLD_HOST_SUFFIX:-local}
      # From .env (or the shell). Set either credentials or ALLOW_NO_AUTH=true.
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ALLOW_NO_AUTH: ${ALLOW_NO_AUTH:-false}
      # Generated by `npm run auth:generate`.
      SQLD_AUTH_TOKEN: ${SQLD_AUTH_TOKEN:?SQLD_AUTH_TOKEN is required; run npm run auth:generate}
      SQLD_ADMIN_TOKEN: ${SQLD_ADMIN_TOKEN:?SQLD_ADMIN_TOKEN is required; run npm run auth:generate}
      # Read-only Ed25519 signing key for minting scoped tokens in the UI.
      SQLD_JWT_PRIVATE_KEY_FILE: /run/secrets/sqld-jwt-private.pem
    volumes:
      # Read-only: the container signs tokens but never needs to modify the key.
      - ./secrets/sqld-jwt-private.pem:/run/secrets/sqld-jwt-private.pem:ro

  sqld:
    image: ghcr.io/tursodatabase/libsql-server:latest
    container_name: sqld
    restart: unless-stopped
    ports:
      - "18080:8080"  # HTTP endpoint (user API)
      - "18081:8082"  # Admin API endpoint (namespace management)
    environment:
      # The image's entrypoint injects --db-path and --http-listen-addr from
      # these variables, so do not also pass them under `command`.
      SQLD_DB_PATH: /var/lib/sqld
      SQLD_HTTP_LISTEN_ADDR: 0.0.0.0:8080
      # User API: verify Bearer JWTs with the public key mounted below.
      SQLD_AUTH_JWT_KEY_FILE: /run/secrets/sqld-jwt-public.pem
      # Admin API: require Authorization: Basic <SQLD_ADMIN_TOKEN>.
      LIBSQL_ADMIN_AUTH_KEY: ${SQLD_ADMIN_TOKEN}
    volumes:
      - ./data:/var/lib/sqld   # persistent database files
      - ./secrets/sqld-jwt-public.pem:/run/secrets/sqld-jwt-public.pem:ro
    command:
      # The image entrypoint only injects its default flags when the first
      # argument is /bin/sqld.
      - /bin/sqld
      - --admin-listen-addr=0.0.0.0:8082
      - --enable-namespaces
      - --disable-default-namespace
